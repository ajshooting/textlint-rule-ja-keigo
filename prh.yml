version: 1
rules:
  - expected: $1円からお預かりします
    pattern: /(\d+)円になります/
    notes: 金額を預かる際の定型表現です。「です」「でございます」を使用します。
  - expected: よろしいでしょうか
    pattern: よろしかったでしょうか
    notes: 過去形にする必要はありません。
  - expected: こちら、$1です
    pattern: /こちら、(.*?)になります/
    notes: AとBがイコールの関係で「なります」を使うのは一般的ではありません。状態の変化を表す場合を除き「です」「でございます」を使用します。
